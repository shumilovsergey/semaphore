---

#---roles
server_roles:
  - prometheus
  - loki
  - grafana
  - alloy
  - smtp_worker
  - node_exporter
  - autossh_identity
  - autossh

#---vars

autossh_tunnels:
  - {name: grafana-autossh, type: R, listen_port: 3000, dest_port: 3000, ssh_host: 45.131.41.34}
  - {name: semaphore-autossh, type: R, listen_port: 9005, dest_port: 9005, ssh_host: 45.131.41.34}
  - {name: gitea-autossh, type: R, listen_port: 9004, dest_port: 9004, ssh_host: 45.131.41.34}
  - {name: sendbox-autossh, type: R, listen_port: 9101, dest_port: 443, ssh_host: 45.131.41.34}
  - {name: vault-autossh, type: R, listen_port: 9000, dest_port: 9000, ssh_host: 45.131.41.34}
  - {name: prometheus-autossh, type: R, listen_port: 9090, dest_port: 9090, ssh_host: 45.131.41.34}
  - {name: buba-cloud-autossh, type: R, listen_port: 9102, dest_port: 9102, ssh_host: 45.131.41.34}
  - {name: youtrack-autossh, type: R, listen_port: 9999, dest_port: 9999, ssh_host: 45.131.41.34}
  - {name: loki-autossh, type: R, listen_port: 9107, dest_port: 9107, ssh_host: 45.131.41.34}
  - {name: grafana2-autossh, type: R, listen_port: 9108, dest_port: 9108, ssh_host: 45.131.41.34}


# -- grafana ------------------------
grafana_port: "9108"
grafana_root_url: "https://grafana2.sh-development.ru"
grafana_datasources:
  - {name: prometheus, type: prometheus, url: "http://127.0.0.1:9090", isDefault: true, scrape_interval: "60s"}
  - {name: loki, type: loki, url: "http://127.0.0.1:9107"}

# -- loki ---------------------------
loki_port: "9107"

# -- alloy --------------------------
alloy_snippets: [system]
alloy_keep_expressions:
  - "sshd.*Accepted (publickey|password) for"


  
