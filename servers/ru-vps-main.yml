---

#---roles
server_roles:
  - nft
  - chrony
  - linux_users_humans

#---vars

nft_allow_input_extra:
  - { port: 80, comment: "http" }
  - { port: 443, comment: "https" }
  - { port: 9100, comment: "node exporter" }
  - { port: 9256, comment: "process exporter" }
  - { port: 35605, comment: "soks-tun" }
  - { port: 35152, comment: "awg-tun" }
  - { port: 3128, comment: "ghost-proxy"}


linux_users_humans_admins:
  - sh

linux_users_humans_ignore:
  - github
  - ssh-tunnel
  - github-runner