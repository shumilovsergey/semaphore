#---roles
server_roles:
  - nft
  - autossh_identity
  - nginx_certbot

#---vars

certbot_email: wumilovsergey@gmail.com
vpn_allow_ip: 5.189.254.175


nft_allow_input_extra:
  - { port: [80, 443], comment: "web" }
  - { port: 4444, comment: "amnezia xray" }
  - { port: 35605, proto: tcp, comment: "amnezia shadowsocks tcp" }
  - { port: 35605, proto: udp, comment: "amnezia shadowsocks udp" }
  - { port: 38331, proto: udp, comment: "amnezia wireguard" }
  - { port: 35152, proto: udp, comment: "amnezia awg" }
  - { port: 53, proto: udp, from: "10.8.0.0/24", comment: "dns vpn clients udp" }
  - { port: 53, proto: tcp, from: "10.8.0.0/24", comment: "dns vpn clients tcp" }


nft_input_raw:
  - "iifname { awg*, wg* } udp dport 53 accept comment 'allow dns from vpn interfaces'"
  - "iifname { awg*, wg* } tcp dport 53 accept comment 'allow dns from vpn interfaces'"
  - "fib daddr type local accept comment 'allow traffic destined to local host'"
  - "fib saddr type local accept comment 'allow traffic originating from local host'"
