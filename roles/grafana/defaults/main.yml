
grafana_version: "13.1.3"

grafana_url: "http://10.10.30.165:9004/sh/s3/raw/branch/main/bin/monitoring/grafana/grafana"
grafana_homepath_url: "http://10.10.30.165:9004/sh/s3/raw/branch/main/bin/monitoring/grafana/grafana-homepath.tar.gz"

grafana_path: "/opt/grafana"
grafana_port: "3000"
grafana_http_addr: "127.0.0.1"

# ---- change !
grafana_root_url: "dont-forget-to-change"
# --------

service_file_path: "/etc/systemd/system/grafana.service"
service_user: service_ansible

bin_path: "{{ grafana_path }}/grafana"
config_path: "{{ grafana_path }}/conf/grafana.ini"
data_path: "{{ grafana_path }}/data"
logs_path: "{{ grafana_path }}/logs"
plugins_path: "{{ grafana_path }}/plugins"
provisioning_path: "{{ grafana_path }}/provisioning"

version_stamp_path: "{{ grafana_path }}/.installed_version"
archive_path: "{{ grafana_path }}/.homepath.tar.gz"


grafana_db_type: "sqlite3"
grafana_db_name: "grafana.db"


#----USER
grafana_admin_user: "sh"
grafana_admin_password: "{{ lookup('env', 'SH_ADMIN_GRAFANA_PASSWORD') }}"


# ВАЖНО про ротацию пароля.
# admin_password из конфига применяется ОДИН раз — когда Grafana создаёт
# базу и в ней ещё нет админа. Дальше пароль живёт в sqlite, и правка
# конфига его не меняет. Роль это проверяет (задача "Verify admin
# credentials") и падает с объяснением, а не делает вид что всё хорошо.
# Сменить пароль:
#   1) поменять SH_ADMIN_GRAFANA_PASSWORD в Variable Group "creds"
#   2) на сервере: sudo -u service_ansible /opt/grafana/grafana cli \
#        --homepath /opt/grafana --config /opt/grafana/conf/grafana.ini \
#        admin reset-admin-password '<новый пароль>'
#   3) прогнать роль — она проверит, что пароль совпал

grafana_allow_sign_up: false
grafana_anonymous_enabled: false

# --- provisioning ---

# Datasources заводятся файлом, а не руками в UI: Grafana при старте
# читает provisioning/datasources/*.yaml. editable: false — в UI их не
# поправить, единственный источник правды здесь.
#
# Заполняется в servers/<hostname>.yml, порядок значения не имеет:
# grafana_datasources:
#   - name: Prometheus
#     type: prometheus
#     url: "http://127.0.0.1:9090"
#     isDefault: true
#   - name: Loki
#     type: loki
#     url: "http://127.0.0.1:9107"
#
# Обязательны только name, type, url. Необязательные ключи:
#   uid            — по умолчанию из name ("Prometheus" -> "prometheus"),
#                    на него ссылаются дашборды, так что менять его потом больно
#   access         — proxy (по умолчанию) | direct
#   orgId          — по умолчанию grafana_datasource_org_id
#   editable       — по умолчанию false
#   database, user — если тип datasource их требует
#   scrape_interval — "Min time interval" в UI, ложится в
#                    jsonData.timeInterval; по умолчанию
#                    grafana_datasource_scrape_interval
#   jsonData       — словарь, любые настройки типа
#   secureJsonData — словарь с секретами, значения брать из
#                    Variable Group "creds" через lookup('env', ...)
#
# Убрали datasource из списка — роль допишет его в deleteDatasources.
# Само по себе исчезновение из файла Grafana не трогает, запись
# останется висеть в базе.
grafana_datasources: []
grafana_datasource_org_id: 1

# Нижняя граница для $__interval в запросах. Держать равным scrape_interval
# самого прометея (roles/prometheus/files/prometheus.config.yml — 60s):
# если тут меньше, Grafana будет запрашивать интервалы мельче, чем в TSDB
# реально есть точки, и графики поедут дырками. Пусто — дефолт Grafana (15s).
# Перебивается на конкретном datasource ключом scrape_interval.
grafana_datasource_scrape_interval: ""

# Типы, которым timeInterval вообще что-то значит. Loki, например, в этот
# список не входит: у него нет scrape-интервала, там ключ просто мусор.
grafana_datasource_scrape_interval_types:
  - prometheus
  - influxdb
  - elasticsearch
  - graphite
  - opentsdb

datasources_path: "{{ provisioning_path }}/datasources/ansible.yaml"
datasources_stamp_path: "{{ grafana_path }}/.provisioned_datasources"
