# Проверка — Variable Group "creds" не подключена к шаблону
- name: Fail if an enabled provider has no password
  fail:
    msg: >
      {{ item.key }}_SMTP_PASSWORD is empty — подключите Variable Group 'creds'
      к шаблону задачи в Semaphore (см. roles/smtp_worker/defaults/main.yml).
  loop: "{{ smtp_worker_providers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.ENABLED | default('') | string | lower == 'true'
    - item.value.PASSWORD | default('') | length == 0

- name: Create smtp-worker directory
  file:
    path: "{{ smtp_worker_path }}"
    state: directory
    mode: "0755"

- name: Check if service already exists
  stat:
    path: "{{ service_file_path }}"
  register: service_file

- name: Fail if port is already in use (first run only)
  wait_for:
    host: localhost
    port: "{{ smtp_worker_port }}"
    state: stopped
    timeout: 3
  when: not service_file.stat.exists

- name: Download smtp-worker binary
  get_url:
    url: "{{ smtp_worker_url }}"
    dest: "{{ bin_path }}"
    mode: "0755"
    force: yes
  notify: Restart smtp-worker

- name: Set ownership on smtp-worker directory
  file:
    path: "{{ smtp_worker_path }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    recurse: yes

- name: Deploy systemd service file
  template:
    src: smtp-worker.service.j2
    dest: "{{ service_file_path }}"
    owner: root
    group: root
    mode: "0600"
  register: service_file_deployed
  no_log: true
  notify: Restart smtp-worker

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  when: service_file_deployed.changed

- name: Enable and start service (first run)
  systemd:
    name: smtp-worker
    state: started
    enabled: yes
  when: not service_file.stat.exists

- name: Apply pending restart before health check
  meta: flush_handlers

- name: Wait for smtp-worker to come up
  wait_for:
    host: 127.0.0.1
    port: "{{ smtp_worker_port }}"
    state: started
    timeout: 15

- name: Health check
  uri:
    url: "http://127.0.0.1:{{ smtp_worker_port }}/health"
    status_code: 200
  register: smtp_worker_health
  until: smtp_worker_health.status == 200
  retries: 3
  delay: 1

- name: Show enabled providers
  debug:
    msg: "smtp-worker {{ smtp_worker_health.json.build }} on 127.0.0.1:{{ smtp_worker_port }}, routes: {{ smtp_worker_health.json.providers | join(', ') | default('none', true) }}"
