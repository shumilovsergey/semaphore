node_exporter_version: "1.12.1"
node_exporter_url: "http://10.10.30.165:9004/sh/s3/raw/branch/main/bin/monitoring/node_exporter/node_exporter"
node_exporter_path: "/opt/node_exporter"
node_exporter_port: "9100"
service_file_path: "/etc/systemd/system/node_exporter.service"
service_user: service_ansible

bin_path: "{{ node_exporter_path }}/node_exporter"
# Бинарь не качается с хоста: артефакт лежит в Gitea, а она видна только
# из сети homelab. Качает контроллер и раздаёт по ssh — RULES.md #5.
# Версия в имени файла: новая версия — новый файл, старый не перекачивается.
node_exporter_cache_dir: "/var/tmp/ansible-bin-cache"
node_exporter_cache_path: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}"
