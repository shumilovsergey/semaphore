---

# Роль приводит DNS хоста к dns_servers/dns_domain и проверяет, что резолвер
# действительно ими пользуется.
#
# Два backend'а — по числу схем, реально встречающихся в парке (инвентаризация
# через server_info metric=dns):
#
#   resolv_conf — статический /etc/resolv.conf, systemd-resolved выключен.
#
#   netplan     — netplan -> networkd -> systemd-resolved (stub). Пишем drop-in
#                 для networkd: netplan мержит nameservers, а не заменяет.
#
# Backend systemd-resolved (запись в resolved.conf.d) сознательно отсутствует - в парке таких нет

- name: dns | validate dns_servers
  assert:
    that:
      - dns_servers | length > 0
      - dns_servers | reject('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}$') | list | length == 0
    fail_msg: "dns_servers должен быть непустым списком IPv4-адресов, сейчас: {{ dns_servers }}"

- name: dns | detect backend
  include_tasks: detect.yml

- name: dns | apply ({{ dns_backend_effective }})
  include_tasks: "backend_{{ dns_backend_effective }}.yml"

# в --check ничего не применялось, проверять нечего
- name: dns | verify effective state
  include_tasks: verify.yml
  when: not ansible_check_mode
