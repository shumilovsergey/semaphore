- name: info | find package of running kernel
  become: true
  ansible.builtin.shell: |
    release=$(uname -r)
    if command -v dpkg-query >/dev/null 2>&1; then
      for path in "/boot/vmlinuz-$release" "/lib/modules/$release" "/usr/lib/modules/$release"; do
        owner=$(dpkg-query -S "$path" 2>/dev/null | head -n 1 | cut -d: -f1)
        if [ -n "$owner" ]; then
          dpkg-query -W -f='${Package} ${Version}\n' "$owner" 2>/dev/null && exit 0
        fi
      done
    elif command -v rpm >/dev/null 2>&1; then
      for path in "/boot/vmlinuz-$release" "/lib/modules/$release" "/usr/lib/modules/$release"; do
        if owner=$(rpm -qf --qf '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' "$path" 2>/dev/null); then
          printf '%s\n' "$owner"
          exit 0
        fi
      done
    fi
    echo 'не определён'
  args:
    executable: /bin/sh
  changed_when: false
  register: info_os_kernel_package

- name: info | output OS and running kernel
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ ansible_distribution }} {{ ansible_distribution_version }}
      ({{ ansible_architecture }}); ядро: {{ ansible_kernel }};
      пакет: {{ info_os_kernel_package.stdout | trim }}
