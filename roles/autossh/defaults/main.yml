---
# Общие для всех туннелей значения. Перебиваются в servers/<hostname>.yml,
# а любое поле — ещё и внутри конкретного туннеля.

# Системный пользователь, от которого работает autossh.
# Ему нужен доступ на чтение к приватному ключу, поэтому это не service_ansible
# (у того nologin и нет home) — см. README роли.
autossh_user: sh

# Пользователь и ключ для подключения к удалённому хосту
autossh_ssh_user: sh
autossh_ssh_key: "/home/{{ autossh_user }}/.ssh/id_rsa"

# Значения по умолчанию для полей туннеля
autossh_default_type: L            # L — обычный (порт открывается локально)
                                   # R — обратный (порт открывается на удалённом хосте)
autossh_default_bind: 127.0.0.1    # 127.0.0.1 — туннель виден только с самой машины
                                   # 0.0.0.0   — туннель доступен из сети
autossh_default_dest_host: 127.0.0.1

# Параметры ssh-сессии
autossh_server_alive_interval: 30
autossh_server_alive_count_max: 3
autossh_strict_host_key_checking: accept-new   # чтобы сервис не падал на первом коннекте

# systemd
autossh_restart_sec: 5
autossh_unit_dir: /etc/systemd/system

# Список туннелей = полное состояние хоста: туннель, которого нет в списке,
# останавливается и удаляется. Роль трогает только юниты со своей меткой —
# написанные руками сервисы не считаются её и не удаляются.
autossh_prune: true
autossh_marker: "# autossh-role-managed"

# Список туннелей. Заполняется в servers/<hostname>.yml
# autossh_tunnels:
#   - name: awg-vpn-reserv      # -> /etc/systemd/system/awg-vpn-reserv.service
#     type: L                   # L | R, по умолчанию autossh_default_type
#     bind: 0.0.0.0             # где слушать порт, по умолчанию autossh_default_bind
#     listen_port: 35152        # какой порт открывается
#     dest_host: 127.0.0.1      # куда пробрасывать, по умолчанию 127.0.0.1
#     dest_port: 35152          # по умолчанию = listen_port
#     ssh_host: 5.189.254.175   # к какому серверу идёт ssh
#     # необязательные, перебивают значения выше:
#     # user: sh
#     # ssh_user: sh
#     # ssh_key: /home/sh/.ssh/id_rsa
#     # description: "своё описание в [Unit]"
#     # options: ["Compression=yes", "Port=2222"]   # доп. -o опции ssh
autossh_tunnels: []
