---

autossh_user: ansible-autossh-user       # от кого работает systemd-юнит (локально)
autossh_ssh_user: ansible-autossh-user   # под кем логинимся на ssh_host (удалённо)
autossh_ssh_key: /home/ansible-autossh-user/.ssh/id_ed25519

# Значения по умолчанию для полей туннеля
autossh_default_type: L
autossh_default_bind: 127.0.0.1 
autossh_default_dest_host: 127.0.0.1

# Параметры ssh-сессии
autossh_server_alive_interval: 30
autossh_server_alive_count_max: 3
autossh_strict_host_key_checking: accept-new   # чтобы сервис не падал на первом коннекте

# systemd
autossh_restart_sec: 5
autossh_unit_dir: /etc/systemd/system

autossh_prune: true
autossh_marker: "# autossh-role-managed"

autossh_tunnels: []
# Список туннелей. Заполняется в servers/<hostname>.yml
# autossh_tunnels:
#   - name: awg-vpn-reserv      # -> /etc/systemd/system/awg-vpn-reserv.service
#     type: L                   # L | R, по умолчанию autossh_default_type
#     bind: 0.0.0.0             # где слушать порт, по умолчанию autossh_default_bind
#     listen_port: 35152        # какой порт открывается
#     dest_host: 127.0.0.1      # куда пробрасывать, по умолчанию 127.0.0.1
#     dest_port: 35152          # по умолчанию = listen_port
#     ssh_host: 5.157.43.175   # к какому серверу идёт ssh
#     # необязательные, перебивают значения выше:
#     # user: sh
#     # ssh_user: sh
#     # ssh_key: /home/sh/.ssh/id_rsa
#     # description: "своё описание в [Unit]"
#     # options: ["Compression=yes", "Port=2222"]   # доп. -o опции ssh


# ПАМЯТКА! -R -----------------------------------#

# server_1 -> -R -> server_2
# Я запускаю туннель server_1, чтобы через server_2 попасть на server_1  Поэтому:

# dest_host:dest_port - это сервис на server_1
# bind:listen_port - это вход на server_2


# ПАМЯТКА! firewall (nft) ------------------------#

# роль nft должна идти раньше!
#
# nft_allow_input_extra — дописать но в файл ТОГО сервера, где порт реально слушается.
# А это разные серверы для L и R:
#   L + bind: 0.0.0.0    порт открывается ЗДЕСЬ (там же, где юнит)
#                        -> nft_allow_input_extra в ЭТОТ servers/<hostname>.yml

#   R + bind: 0.0.0.0    порт открывается на ssh_host
#                        -> nft_allow_input_extra в файл ssh_host, НЕ в этот

#   bind: 127.0.0.1      открывать нечего, слушает только loopback


