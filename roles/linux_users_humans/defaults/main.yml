
linux_users_humans_keys:
  sh:
    - "ssh-rsa  sh@Shumilovs-MacBook-Air.local"
#  sa.shumilov:
#    - "ssh-ed25519 AAAA... sa.shumilov@laptop"
#    - "ssh-ed25519 AAAA... sa.shumilov@work"

# false — только создать недостающих и переписать authorized_keys.
# true  — привести сервер строго к спискам: лишних людей удалить,
#         чужие файлы из sudoers.d унести (см. ниже и шапку tasks/main.yml).
linux_users_humans_clean_up: false

# Кто есть на сервере. Задаются в servers/<hostname>.yml.
# При linux_users_humans_clean_up: true остальные люди (UID в диапазоне
# UID_MIN..UID_MAX из /etc/login.defs) удаляются, их дома уезжают
# в linux_users_humans_removed_dir.
# Пользователь, под которым заходит Ansible, и root не трогаются никогда.
#
# Кого роль считает людьми (то есть кандидатами на удаление) — посмотреть
# на сервере до первого прогона:
#   awk -F: '$3 >= 1000 && $3 < 60000 {print $1, $3, $6}' /etc/passwd
# Всё из вывода, чего нет ни в одном списке ниже, будет удалено.
linux_users_humans_admins: []   # дом + ключи + sudo без пароля
linux_users_humans_users: []    # дом + ключи
linux_users_humans_ignore: []

linux_users_humans_removed_dir: /home/.removed
linux_users_humans_sudoers_file: /etc/sudoers.d/linux_users_humans
