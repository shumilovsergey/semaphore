# Приводит людей на сервере строго к списку из servers/<hostname>.yml:
#   linux_users_humans_admins — дом, ключи, sudo без пароля;
#   linux_users_humans_users  — дом, ключи.
# Ключи берутся из linux_users_humans_keys (defaults), authorized_keys
# переписывается целиком.
#
# Человек — пользователь из /etc/passwd с UID в UID_MIN..UID_MAX из
# /etc/login.defs. Системные и сервисные учётки (UID ниже) роль не видит,
# LDAP/SSSD тоже: читается сам /etc/passwd, а не getent.
# Всех людей не из списков роль удаляет: убивает их процессы, делает
# userdel без -r и переносит дом в linux_users_humans_removed_dir/<имя>-<время>.
# Дом переносится, только если это каталог, принадлежащий этому UID, и
# отдаётся root: освободившийся UID система выдаст следующему новому
# пользователю, и архив иначе оказался бы его.
#
# Не трогаются никогда: root и пользователь, под которым заходит Ansible
# (определяется через whoami без become — переменная не нужна). Это и
# есть аварийный вход: через Semaphore на сервер попасть можно всегда.
# Так же не трогаются учётки из linux_users_humans_ignore — не люди, но с
# UID из человеческого диапазона (github runner и т. п.): роль убила бы их
# процессы и унесла дом вместе с установленным сервисом.
#
# sudoers.d тоже приводится к списку: остаются только README, файл роли
# и /etc/sudoers.d/<пользователь Ansible> (его кладёт
# tools/ansible-client-init.sh). Если этого файла нет, роль падает до
# любых изменений — иначе зачистка могла бы отнять у Ansible sudo.
# Членство в группах (sudo, wheel, docker) роль не трогает.
#
# ~/.ssh принадлежит пользователю, и симлинком он мог бы направить запись
# root'а в чужой файл — поэтому симлинк вместо ~/.ssh роль не трогает и падает.
#
# Новым пользователям ставится пароль "*": по паролю не войти, но учётка
# не заблокирована — sshd с UsePAM no не пускает заблокированную ("!")
# даже по ключу. Пароль существующих пользователей не меняется.
#
# Имена: строчные латинские буквы, цифры, _ - и точка (sa.shumilov),
# не длиннее 32 символов, первый символ — буква или _.
#

- name: Detect the user Ansible logs in as
  command: whoami
  become: false
  register: linux_users_humans_whoami
  changed_when: false

- name: Collect names
  set_fact:
    linux_users_humans_self: "{{ linux_users_humans_whoami.stdout }}"
    linux_users_humans_wanted: "{{ linux_users_humans_admins + linux_users_humans_users }}"
    linux_users_humans_protected: "{{ ['root', linux_users_humans_whoami.stdout] + linux_users_humans_ignore }}"

- name: Fail on invalid user names
  fail:
    msg: >
      Недопустимые имена: {{ linux_users_humans_wanted | reject('match', '^[a-z_][a-z0-9_.-]{0,31}$') | join(', ') }}.
      Разрешены строчные латинские буквы, цифры, _ - и точка, до 32 символов,
      первый символ — буква или _.
  when: linux_users_humans_wanted | reject('match', '^[a-z_][a-z0-9_.-]{0,31}$') | list | length > 0

- name: Fail if a user is both admin and user
  fail:
    msg: "И в admins, и в users: {{ linux_users_humans_admins | intersect(linux_users_humans_users) | join(', ') }}"
  when: linux_users_humans_admins | intersect(linux_users_humans_users) | length > 0

- name: Fail if a protected user is listed
  fail:
    msg: >
      {{ linux_users_humans_wanted | intersect(linux_users_humans_protected) | join(', ') }}
      одновременно в admins/users и среди нетрогаемых (root, пользователь Ansible
      {{ linux_users_humans_self }}, linux_users_humans_ignore). Для root и Ansible
      роль переписала бы authorized_keys и отрезала бы доступ.
      Уберите из одного из списков в servers/{{ inventory_hostname }}.yml.
  when: linux_users_humans_wanted | intersect(linux_users_humans_protected) | length > 0

- name: Fail if a user has no keys
  fail:
    msg: >
      Нет ключей в linux_users_humans_keys (roles/linux_users_humans/defaults/main.yml):
      {{ linux_users_humans_wanted | reject('in', linux_users_humans_keys | dict2items | selectattr('value') | map(attribute='key') | list) | join(', ') }}
  when: linux_users_humans_wanted | reject('in', linux_users_humans_keys | dict2items | selectattr('value') | map(attribute='key') | list) | list | length > 0

- name: Check sudoers drop-in of the Ansible user
  stat:
    path: "/etc/sudoers.d/{{ linux_users_humans_self }}"
  register: linux_users_humans_self_sudoers
  when: linux_users_humans_self != 'root'

- name: Fail if the Ansible user has no sudoers drop-in
  fail:
    msg: >
      Нет /etc/sudoers.d/{{ linux_users_humans_self }}. Роль удаляет из sudoers.d всё,
      кроме этого файла и своего, — без него Ansible потеряет sudo.
      Запустите на хосте tools/ansible-client-init.sh.
  when:
    - linux_users_humans_self != 'root'
    - not linux_users_humans_self_sudoers.stat.exists

- name: List human users
  shell:
    cmd: |
      min=$(awk '$1 == "UID_MIN" {print $2}' /etc/login.defs)
      max=$(awk '$1 == "UID_MAX" {print $2}' /etc/login.defs)
      awk -F: -v min="${min:-1000}" -v max="${max:-60000}" '$3 >= min && $3 <= max {print $1 ":" $3 ":" $6}' /etc/passwd
    executable: /bin/bash
  register: linux_users_humans_present
  changed_when: false

# элементы — [имя, uid, home]
- name: Pick users to remove
  set_fact:
    linux_users_humans_extra: >-
      {{ linux_users_humans_present.stdout_lines | map('split', ':')
         | rejectattr('0', 'in', linux_users_humans_wanted + linux_users_humans_protected) | list }}

- name: Show users to remove
  debug:
    msg: "Удаляются: {{ linux_users_humans_extra | map(attribute='0') | join(', ') }}"
  when: linux_users_humans_extra | length > 0

- name: Check homes of removed users
  stat:
    path: "{{ item.2 }}"
    follow: false
  loop: "{{ linux_users_humans_extra }}"
  loop_control:
    label: "{{ item.0 }}"
  register: linux_users_humans_extra_homes

- name: Kill processes of removed users
  command:
    argv: [pkill, -KILL, -u, "{{ item.0 }}"]
  loop: "{{ linux_users_humans_extra }}"
  loop_control:
    label: "{{ item.0 }}"
  register: linux_users_humans_pkill
  changed_when: linux_users_humans_pkill.rc == 0
  failed_when: linux_users_humans_pkill.rc > 1

- name: Remove users
  user:
    name: "{{ item.0 }}"
    state: absent
    remove: false
    force: true
  loop: "{{ linux_users_humans_extra }}"
  loop_control:
    label: "{{ item.0 }}"

- name: Create directory for removed homes
  file:
    path: "{{ linux_users_humans_removed_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: linux_users_humans_extra | length > 0

- name: Move homes of removed users aside
  shell:
    cmd: |
      dest={{ (linux_users_humans_removed_dir ~ '/' ~ item.item.0 ~ '-' ~ ansible_facts.date_time.iso8601_basic_short) | quote }}
      mv -- {{ item.stat.path | quote }} "$dest"
      chown -R root:root "$dest"
    executable: /bin/bash
  loop: "{{ linux_users_humans_extra_homes.results }}"
  loop_control:
    label: "{{ item.item.0 }}"
  when:
    - item.stat.isdir | default(false)
    - item.stat.uid == item.item.1 | int

- name: Create users
  user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
    password: "*"
    update_password: on_create
  loop: "{{ linux_users_humans_wanted }}"
  register: linux_users_humans_created

- name: Check .ssh directories
  stat:
    path: "{{ item.home }}/.ssh"
    follow: false
  loop: "{{ linux_users_humans_created.results }}"
  loop_control:
    label: "{{ item.name }}"
  register: linux_users_humans_ssh_dirs

- name: Fail if .ssh is a symlink
  fail:
    msg: "{{ item.stat.path }} — симлинк. Удалите его руками и перезапустите роль."
  loop: "{{ linux_users_humans_ssh_dirs.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.islnk | default(false)

- name: Create .ssh directories
  file:
    path: "{{ item.home }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "0700"
  loop: "{{ linux_users_humans_created.results }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write authorized_keys
  copy:
    content: "{{ linux_users_humans_keys[item.name] | join('\n') }}\n"
    dest: "{{ item.home }}/.ssh/authorized_keys"
    owner: "{{ item.name }}"
    group: "{{ item.group }}"
    mode: "0600"
  loop: "{{ linux_users_humans_created.results }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy sudoers for admins
  template:
    src: sudoers.j2
    dest: "{{ linux_users_humans_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Find sudoers drop-ins
  find:
    paths: /etc/sudoers.d
    file_type: any
    hidden: true
  register: linux_users_humans_sudoers_d

- name: Remove foreign sudoers drop-ins
  file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ linux_users_humans_sudoers_d.files | map(attribute='path')
       | reject('in', ['/etc/sudoers.d/README', linux_users_humans_sudoers_file,
                       '/etc/sudoers.d/' ~ linux_users_humans_self]) | list }}
