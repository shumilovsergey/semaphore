alloy_version: "1.18.1"

alloy_url: "http://10.10.30.165:9004/sh/s3/raw/branch/main/bin/monitoring/alloy/alloy"

alloy_cache_dir: "/var/tmp/ansible-bin-cache"
alloy_cache_path: "{{ alloy_cache_dir }}/alloy-{{ alloy_version }}"

alloy_path: "/opt/alloy"
alloy_http_addr: "127.0.0.1"
alloy_port: "12345"
alloy_log_level: "info"
service_file_path: "/etc/systemd/system/alloy.service"

# Читает чужие логи - даем много прав
service_user: root

bin_path: "{{ alloy_path }}/alloy"
config_path: "{{ alloy_path }}/config.alloy"
data_path: "{{ alloy_path }}/data"

version_stamp_path: "{{ alloy_path }}/.installed_version"
alloy_loki_url: "http://127.0.0.1:9107/loki/api/v1/push"

# Какие снипеты собрать в config.alloy. Имя = файл в
# templates/snippets/<name>.alloy.j2. Задаётся в servers/<hostname>.yml:
#   alloy_snippets: [system, nginx]
# Пустой список — агент поднимется, но не будет читать ничего.
alloy_snippets: []

# --- snippets/system.alloy.j2 ---
# Насколько старые записи журнала забирать при первом старте.
# Больше — при первом запуске зальёт в Loki всю историю разом.
alloy_journal_max_age: "12h"

# --- snippets/nginx.alloy.j2 ---
alloy_nginx_access_glob: "/var/log/nginx/*access*.log"
alloy_nginx_error_glob: "/var/log/nginx/*error*.log"

# --- snippets/ansible.alloy.j2 ---
# Каталог, куда пишут логи регулярные задачи Semaphore. Наполняет его не
# роль, а сам Ansible: в Environment нужного шаблона задаётся переменная
# окружения ANSIBLE_LOG_PATH со своим файлом на шаблон, например
#   {"ANSIBLE_LOG_PATH": "/var/log/ansible/scheduled/backup_sync.log"}
# Ручные прогоны этой переменной не получают и пишут в log_path из
# ansible.cfg, поэтому в Loki не попадают.
#
# Каталог должен существовать на хосте Semaphore: Ansible его не создаёт,
# а при отсутствии просто отключает логирование с warning в stdout.
alloy_ansible_log_dir: "/var/log/ansible/scheduled"
alloy_ansible_log_glob: "{{ alloy_ansible_log_dir }}/*.log"

# --- фильтр, общий для всех снипетов ---
alloy_keep_expressions: []
# белый список: совпало = попало, всё остальное отбрасывается
  # alloy_keep_expressions:
  #   - '" (4|5)[0-9][0-9] '      все 4xx/5xx
  #   - "Mozilla"                 живые браузеры
