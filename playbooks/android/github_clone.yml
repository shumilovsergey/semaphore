---

# Дома новы, но предрассудки стары.
# Порадуйтесь, не истребят
# Ни годы их, ни моды, ни пожары.


# Зеркалирование GitHub-аккаунтов на Android-телефон.
#
# На входе — ссылки на аккаунты (личные или организации), не на репозитории.
# Плейбук спрашивает у GitHub API всё публичное, что у каждого из них есть,
# и держит по bare-зеркалу на репозиторий:
#
#   backup/github-cloner/<owner>/<repo>.git
#
# owner в нижнем регистре — у личного аккаунта и организации могут быть
# одноимённые репозитории, поэтому раскладка по владельцам.
#
# Зеркало никогда не удаляется: репозиторий, пропавший с GitHub, остаётся
# лежать как был — из него и восстанавливают удалённые проекты. В конце
# прогона такие зеркала перечислены отдельно.
#
# Прокси нет: и API, и git ходят на github.com напрямую. Глобальный и системный
# git-конфиг телефона и переменные *_proxy игнорируются намеренно, чтобы
# старая настройка прокси в Termux не перехватила трафик. remote.origin.url
# у существующих зеркал при каждом прогоне переписывается на прямой адрес.
#
# Токен не нужен, пока все репозитории публичные: анонимный лимит API —
# 60 запросов в час, прогон тратит 1 + ceil(N/100) на аккаунт.
#
# Зеркала из старой плоской раскладки (backup/github-cloner/<repo>.git)
# переносятся под владельца автоматически, владелец берётся из их remote URL.
#
# Список аккаунтов — github_clone_sources в vars ниже, Extra Variables
# не нужны. Переданный из Semaphore github_clone_sources заменит его целиком.


- name: Mirror GitHub accounts (Termux)
  hosts: seeker
  gather_facts: false
  become: false

  vars:
    termux_prefix: /data/data/com.termux/files/usr
    termux_home: /data/data/com.termux/files/home
    backup_dir: "{{ termux_home }}/backup/github-cloner"


    # В Termux нет записи в passwd для u0_aXXX. Ansible разворачивает '~' не сам,
    # а через remote `echo ~u0_a226`
    ansible_remote_tmp: "{{ termux_home }}/.ansible/tmp"
    ansible_async_dir: "{{ termux_home }}/.ansible_async"

    termux_wake_lock: true

    # потолок времени на ОДИН репозиторий, сек
    clone_timeout: 1800

    github_clone_sources:
      - https://github.com/shumilovsergey
      - https://github.com/sh-devment
    github_clone_include_forks: false

    github_api_headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"

  pre_tasks:
    - name: Old variable github_clone_targets is not used
      ansible.builtin.assert:
        that: github_clone_targets is not defined
        fail_msg: >
          github_clone_targets больше не читается. Список отдельных репозиториев
          заменён на github_clone_sources — ссылки на аккаунты или организации,
          например ["https://github.com/shumilovsergey"].
        quiet: true

    - name: Check Termux binaries
      ansible.builtin.stat:
        path: "{{ termux_prefix }}/bin/{{ item }}"
      register: termux_bins
      loop:
        - pkg
        - git
      loop_control:
        label: "{{ item }}"

    # Ловит сразу два случая: подключились не в Termux (например, в proot-Debian
    # на другом порту) и Termux без нужных пакетов.
    - name: Host is Termux and has git
      ansible.builtin.assert:
        that: termux_bins.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >
          Не найдено: {{ termux_bins.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}.
          Если это не Termux — проверь ansible_host/ansible_port в inventory.
          Если Termux — поставь пакеты: pkg install git openssh
        success_msg: "Termux найден: {{ termux_prefix }}"

    - name: Backup directory is not on shared storage
      ansible.builtin.assert:
        that: backup_dir is not match('^/(sdcard|storage)/')
        fail_msg: >
          backup_dir={{ backup_dir }} лежит на общем хранилище Android.
          Это FUSE без симлинков и прав — git-репозиторий там побьётся.
          Держи зеркала во внутренней памяти Termux ({{ termux_home }}).
        success_msg: "backup_dir на внутренней ФС: {{ backup_dir }}"

    # https://github.com/name, github.com/name/, просто name — всё сводится к name
    - name: Parse account names from sources
      ansible.builtin.set_fact:
        github_owners: >-
          {{ (github_clone_sources if github_clone_sources is not string else [github_clone_sources])
             | map('trim')
             | map('regex_replace', '^(https?://)?(www[.])?github[.]com/', '')
             | map('regex_replace', '/+$', '')
             | unique | list }}

    - name: Sources are account links
      ansible.builtin.assert:
        that:
          - github_owners | length > 0
          - github_owners | reject('match', '^[A-Za-z0-9-]+$') | list | length == 0
        fail_msg: >
          github_clone_sources должен быть списком ссылок на аккаунты или организации
          вида https://github.com/<name>. Не разобрано:
          {{ github_owners | reject('match', '^[A-Za-z0-9-]+$') | list }}
        success_msg: "Аккаунты: {{ github_owners | join(', ') }}"

    # Один эндпоинт /users/ отвечает и за людей, и за организации.
    # 404 здесь — опечатка в имени аккаунта.
    - name: Ask GitHub API for accounts
      ansible.builtin.uri:
        url: "https://api.github.com/users/{{ item }}"
        headers: "{{ github_api_headers }}"
        use_proxy: false
      register: github_accounts
      loop: "{{ github_owners }}"

    - name: Plan API pages
      ansible.builtin.set_fact:
        github_pages: >-
          {%- set out = [] -%}
          {%- for a in github_accounts.results -%}
          {%- for p in range(1, ((a.json.public_repos | int) + 99) // 100 + 1) -%}
          {%- set _ = out.append({'owner': a.json.login, 'type': a.json.type, 'page': p}) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Ask GitHub API for repositories
      ansible.builtin.uri:
        url: >-
          https://api.github.com/users/{{ item.owner }}/repos?type=owner&sort=full_name&per_page=100&page={{ item.page }}
        headers: "{{ github_api_headers }}"
        use_proxy: false
      register: github_api
      loop: "{{ github_pages }}"
      loop_control:
        label: "{{ item.owner }} ({{ item.type }}) page {{ item.page }}"

    - name: Build repository list
      ansible.builtin.set_fact:
        github_repos: >-
          {%- set out = [] -%}
          {%- for r in github_api.results | map(attribute='json') | flatten -%}
          {%- if github_clone_include_forks | bool or not r.fork -%}
          {%- set _ = out.append({'owner': r.owner.login | lower, 'name': r.name, 'url': r.clone_url}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Repository list is not empty
      ansible.builtin.assert:
        that: github_repos | length > 0
        fail_msg: >
          У аккаунтов {{ github_owners | join(', ') }} не нашлось ни одного
          публичного репозитория{{ '' if github_clone_include_forks | bool else ' (форки пропущены)' }}.
        success_msg: >-
          Репозиториев в очереди: {{ github_repos | length }}
          ({% for o, g in github_repos | groupby('owner') %}{{ o }}: {{ g | length }}{{ ', ' if not loop.last }}{% endfor %})

  tasks:
    - name: Acquire Termux wake lock
      ansible.builtin.command: "{{ termux_prefix }}/bin/termux-wake-lock"
      changed_when: false
      when: termux_wake_lock | bool

    - name: Mirror repositories
      block:
        - name: Ensure owner directories exist
          ansible.builtin.file:
            path: "{{ backup_dir }}/{{ item }}"
            state: directory
            mode: "0700"
          loop: "{{ github_repos | map(attribute='owner') | unique | list }}"

        # Старая раскладка: backup_dir/<repo>.git. Владелец — из remote URL.
        - name: Move flat mirrors under their owner
          ansible.builtin.shell:
            executable: "{{ termux_prefix }}/bin/bash"
            cmd: |
              set -eu
              shopt -s nullglob
              for dir in "{{ backup_dir }}"/*.git; do
                [ -d "$dir" ] || continue
                url=$(git -C "$dir" config --get remote.origin.url || true)
                owner=$(printf '%s' "$url" | sed -nE 's#.*github\.com[/:]([A-Za-z0-9-]+)/[^/]+/?$#\1#p' | tr 'A-Z' 'a-z')
                if [ -z "$owner" ]; then echo "SKIP $dir: owner not found in '$url'"; continue; fi
                dest="{{ backup_dir }}/$owner/$(basename "$dir")"
                if [ -e "$dest" ]; then echo "SKIP $dir: $dest exists"; continue; fi
                mkdir -p "{{ backup_dir }}/$owner"
                mv "$dir" "$dest"
                echo "MOVED $dir -> $dest"
              done
          register: flat_move
          changed_when: "'MOVED' in flat_move.stdout"

        - name: Show moved mirrors
          ansible.builtin.debug:
            var: flat_move.stdout_lines
          when: flat_move.stdout_lines | length > 0

        - name: Mirror or update each repository
          ansible.builtin.shell:
            executable: "{{ termux_prefix }}/bin/bash"
            cmd: |
              set -eu
              unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY
              target="{{ backup_dir }}/{{ item.owner }}/{{ item.name }}.git"
              refs() { git -C "$target" for-each-ref --format='%(objectname) %(refname)' | sha256sum; }

              if [ -d "$target" ]; then
                git -C "$target" remote set-url origin "{{ item.url }}"
                before=$(refs)
                git -C "$target" remote update --prune
                if [ "$before" = "$(refs)" ]; then echo "STATUS=unchanged"; else echo "STATUS=updated"; fi
              else
                rm -rf "$target.incomplete"
                git clone --mirror "{{ item.url }}" "$target.incomplete"
                mv "$target.incomplete" "$target"
                echo "STATUS=cloned"
              fi
          environment:
            # Без этого git без кредов уходит в приглашение ввода и висит
            # вечно: у Ansible нет tty, отвечать некому. Пусть падает сразу.
            GIT_TERMINAL_PROMPT: "0"
            GIT_CONFIG_GLOBAL: /dev/null
            GIT_CONFIG_NOSYSTEM: "1"
          loop: "{{ github_repos }}"
          loop_control:
            label: "{{ item.owner }}/{{ item.name }}"
          register: clone_result
          # упавший репозиторий не должен останавливать остальные — итог ниже
          failed_when: false
          changed_when: "'STATUS=unchanged' not in (clone_result.stdout | default(''))"
          # async снимает главную беду прошлой версии: задача больше не держит
          # одно ssh-соединение открытым весь клон и не висит бесконечно
          async: "{{ clone_timeout }}"
          poll: 15

        - name: Show result for each repository
          ansible.builtin.debug:
            msg: >-
              {{ item.item.owner }}/{{ item.item.name }} —
              {{ (item.stdout_lines | default([]) | select('match', '^STATUS=') | first | default('STATUS=FAILED')) | replace('STATUS=', '') }}
          loop: "{{ clone_result.results }}"
          loop_control:
            label: "{{ item.item.owner }}/{{ item.item.name }}"

        - name: Find mirrors no longer on GitHub
          ansible.builtin.find:
            paths: "{{ backup_dir }}"
            patterns: "*.git"
            file_type: directory
            recurse: true
            depth: 2
          register: local_mirrors

        - name: Show mirrors no longer on GitHub
          ansible.builtin.debug:
            msg: "Хранятся, но на GitHub их больше нет: {{ github_orphans }}"
          vars:
            github_expected: >-
              {%- set out = [] -%}
              {%- for r in github_repos -%}{%- set _ = out.append(r.owner ~ '/' ~ r.name ~ '.git') -%}{%- endfor -%}
              {{ out }}
            github_orphans: >-
              {{ local_mirrors.files | map(attribute='path')
                 | map('regex_replace', '^' ~ (backup_dir | regex_escape) ~ '/', '')
                 | reject('search', '[.]incomplete$')
                 | difference(github_expected) | sort }}
          when: github_orphans | length > 0

        - name: All repositories mirrored
          ansible.builtin.assert:
            that: clone_failed | length == 0
            fail_msg: >
              Не удалось: {{ clone_failed | map(attribute='item.url') | join(', ') }}.
              Ошибки — в выводе задачи "Mirror or update each repository" (stderr/msg).
              Остальные зеркала обновлены.
            quiet: true
          vars:
            clone_failed: >-
              {%- set out = [] -%}
              {%- for r in clone_result.results if 'STATUS=' not in (r.stdout | default('')) -%}{%- set _ = out.append(r) -%}{%- endfor -%}
              {{ out }}

      always:
        - name: Release Termux wake lock
          ansible.builtin.command: "{{ termux_prefix }}/bin/termux-wake-unlock"
          changed_when: false
          when: termux_wake_lock | bool
