---

# Один сервер: тянем /backup в staging, толкаем на телефон во временный
# каталог, сверяем, переименовываем, чистим лишние поколения.
#
# Любая ошибка ловится rescue: сервер помечается FAILED, остальные продолжают.
# Ни одна задача до "Promote generation" не трогает уже лежащие поколения,
# поэтому падение на любом шаге оставляет прошлые копии как были.

- name: "Sync {{ backup_server }}"
  block:

    # backup_src берём из host_vars сервера, если он там переопределён.
    # Реквизиты подключения — из inventory, чтобы rsync ходил тем же путём,
    # что и обычные задачи Ansible.
    - name: Resolve connection details
      ansible.builtin.set_fact:
        srv_host: "{{ hostvars[backup_server].ansible_host | default(backup_server) }}"
        srv_user: "{{ hostvars[backup_server].ansible_user | default('ansible') }}"
        srv_port: "{{ hostvars[backup_server].ansible_port | default(22) }}"
        srv_src: "{{ hostvars[backup_server].backup_src | default(backup_src) }}"
        srv_staging: "{{ backup_staging }}/{{ backup_server }}"
        srv_gen: "{{ backup_dest }}/{{ backup_server }}/backup-{{ backup_stamp }}"

    - name: Ensure staging directory exists
      ansible.builtin.file:
        path: "{{ srv_staging }}"
        state: directory
        mode: "0700"
      delegate_to: localhost

    # --delete обязателен: staging должен быть зеркалом ТЕКУЩЕГО состояния
    # сервера. Без него файлы, которые ротация на сервере уже удалила, оседали
    # бы в staging навсегда, и каждое поколение на телефоне тащило бы всю
    # историю — каталог рос бы бесконечно.
    - name: "Hop 1 — pull {{ srv_src }} into staging"
      ansible.builtin.command:
        argv:
          - rsync
          - -rti
          - --delete
          - "--rsync-path={{ backup_rsync_path }}"
          - -e
          - "ssh -p {{ srv_port }} {{ backup_ssh_opts }}"
          - "{{ srv_user }}@{{ srv_host }}:{{ srv_src }}/"
          - "{{ srv_staging }}/"
      delegate_to: localhost
      register: hop1
      changed_when: hop1.stdout | length > 0
      async: "{{ backup_timeout }}"
      poll: 15
      vars:
        # ansible_async_dir из play — это путь внутри Termux, а задача
        # выполняется на Ansible-хосте: delegate_to меняет исполнителя, но
        # переменные play остаются, и async_wrapper пошёл бы создавать
        # /data/data/... на Ansible-хосте. Перебиваем локальным путём.
        ansible_async_dir: "{{ backup_staging }}/.async"

    - name: Count files and bytes in staging
      ansible.builtin.shell:
        cmd: |
          set -u
          printf '%s %s\n' \
            "$(find '{{ srv_staging }}' -type f | wc -l | tr -d ' ')" \
            "$(find '{{ srv_staging }}' -type f -exec stat -c '%s' {} + 2>/dev/null | awk '{s+=$1} END {print s+0}')"
      delegate_to: localhost
      changed_when: false
      register: src_count

    - name: Remember source size
      ansible.builtin.set_fact:
        src_files: "{{ src_count.stdout.split()[0] | int }}"
        src_bytes: "{{ src_count.stdout.split()[1] | int }}"

    # Ключевая проверка. Сверка "файлов на телефоне == файлов в источнике"
    # проходит на ура, когда в источнике ноль: пустой /backup дал бы валидное
    # пустое поколение, которое вытеснило бы хорошее. Это ровно тот сценарий,
    # ради которого три поколения и держим, так что ловим его здесь.
    # Тот же смысл, что у `[ -s "$BACKUP_FILE" ]` в скрипте на сервере.
    - name: Source backup directory is not empty
      ansible.builtin.assert:
        that: src_files | int > 0
        fail_msg: >
          {{ srv_src }} на {{ backup_server }} пуст. Поколение не создаётся,
          прошлые копии на телефоне не тронуты. Проверь, что бэкапы там
          действительно есть и каталог не отвалился.
        success_msg: "{{ backup_server }}: {{ src_files }} файлов, {{ src_bytes | int | human_readable }}"

    - name: Ensure server directory exists on the phone
      ansible.builtin.file:
        path: "{{ backup_dest }}/{{ backup_server }}"
        state: directory

    # Мусор от прошлых оборванных запусков. Докачивать его мы не пробуем:
    # поколение целиком дешевле перелить, чем доказать, что недокачанное
    # осталось консистентным.
    - name: Drop leftover .incomplete generations
      ansible.builtin.command:
        argv:
          - find
          - "{{ backup_dest }}/{{ backup_server }}"
          - -maxdepth
          - "1"
          - -type
          - d
          - -name
          - "backup-*.incomplete"
          - -exec
          - rm
          - -rf
          - "{}"
          - +
      changed_when: false

    # Права на общее хранилище Android не тащим: там их просто нет, и rsync
    # без этих флагов заваливает вывод ошибками chown/chmod.
    # --delete не нужен: пишем в заведомо пустой каталог.
    - name: "Hop 2 — push staging into {{ backup_server }}/backup-{{ backup_stamp }}.incomplete"
      ansible.builtin.command:
        argv:
          - rsync
          - -rti
          - --no-perms
          - --no-owner
          - --no-group
          - -e
          - "ssh -p {{ phone_port }} {{ backup_ssh_opts }}"
          - "{{ srv_staging }}/"
          - "{{ phone_user }}@{{ phone_host }}:{{ srv_gen }}.incomplete/"
      delegate_to: localhost
      register: hop2
      changed_when: hop2.stdout | length > 0
      async: "{{ backup_timeout }}"
      poll: 15
      vars:
        # см. комментарий у Hop 1 — задача идёт с Ansible-хоста, не с телефона
        ansible_async_dir: "{{ backup_staging }}/.async"

    - name: Count files and bytes in the new generation
      ansible.builtin.shell:
        executable: "{{ termux_prefix }}/bin/bash"
        cmd: |
          set -u
          printf '%s %s\n' \
            "$(find '{{ srv_gen }}.incomplete' -type f | wc -l | tr -d ' ')" \
            "$(find '{{ srv_gen }}.incomplete' -type f -exec stat -c '%s' {} + 2>/dev/null | awk '{s+=$1} END {print s+0}')"
      changed_when: false
      register: dst_count

    # rsync с кодом 0 — необходимо, но не достаточно: оборванное соединение,
    # кончившееся место на телефоне и битый FUSE выглядят по-разному, а вот
    # "файлов и байт столько же, сколько в источнике" ловит их все разом.
    - name: New generation matches the source
      ansible.builtin.assert:
        that:
          - dst_count.stdout.split()[0] | int == src_files | int
          - dst_count.stdout.split()[1] | int == src_bytes | int
        fail_msg: >
          Копия не сошлась с источником:
          на телефоне {{ dst_count.stdout.split()[0] }} файлов /
          {{ dst_count.stdout.split()[1] | int | human_readable }},
          в источнике {{ src_files }} файлов / {{ src_bytes | int | human_readable }}.
          Каталог остаётся с суффиксом .incomplete и поколением не считается,
          прошлые копии не тронуты.
        success_msg: "Копия сошлась: {{ src_files }} файлов, {{ src_bytes | int | human_readable }}"

    # Единственный шаг, после которого поколений становится больше.
    # Всё, что могло пойти не так, уже проверено выше.
    - name: Promote generation
      ansible.builtin.command:
        argv:
          - mv
          - "{{ srv_gen }}.incomplete"
          - "{{ srv_gen }}"

    # Тот же приём, что в скрипте ротации на сервере: имена с датой сортируются
    # лексикографически, значит и хронологически. .incomplete в выборку не
    # попадает, поэтому недокачанный каталог не может вытеснить готовый.
    - name: "Keep only the last {{ backup_generations }} generations"
      ansible.builtin.shell:
        executable: "{{ termux_prefix }}/bin/bash"
        cmd: |
          set -u
          find '{{ backup_dest }}/{{ backup_server }}' -maxdepth 1 -type d \
              -name 'backup-*' ! -name '*.incomplete' \
            | sort -r \
            | tail -n +{{ (backup_generations | int) + 1 }} \
            | xargs -r rm -rf
      changed_when: false

    - name: Record success
      ansible.builtin.set_fact:
        backup_results: "{{ backup_results + [{'server': backup_server, 'status': 'OK', 'msg': ''}] }}"

  rescue:
    - name: Record failure
      ansible.builtin.set_fact:
        backup_results: "{{ backup_results + [{'server': backup_server, 'status': 'FAILED', 'msg': reason}] }}"
      vars:
        reason: >-
          {{ (ansible_failed_result.msg | default('неизвестная ошибка'))
             | replace('\n', ' ') | truncate(120, true) }}
