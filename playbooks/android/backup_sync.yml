---
#
# Телефон не видит серверы напрямую, поэтому данные идут в два прыжка через
# Ansible-хост:
#
#   сервер:/backup  ──scp──>  staging на Ansible-хосте  ──scp──>  телефон
#
# ----- ШАБЛОН Semaphore extra ENV JSON
#
# {
#   "backup_servers": ["ru-vps-main", "la-vps"]
# }


- name: Sync server backups to Android device
  hosts: seeker
  gather_facts: false
  become: false

  vars:
    termux_prefix: /data/data/com.termux/files/usr
    termux_home: /data/data/com.termux/files/home



    termux_wake_lock: true

    # какие серверы бэкапим — список имён из inventory, задаётся в Semaphore
    backup_servers: []
    backup_src: /backup
    backup_staging: /var/tmp/backup-staging

    # куда кладём на телефоне
    backup_dest: /sdcard/backup-storage

    # сколько успешных поколений держим на каждый сервер
    backup_generations: 3

    backup_scp_opts:
      - -O


ПРОВЕРКА ОШИБКИ

    backup_ssh_opts: >-
      -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      -o ConnectTimeout=15 -o ServerAliveInterval=15
      -o ServerAliveCountMax=4

    backup_transfer_retries: 3
    backup_transfer_delay: 5

  pre_tasks:
    - name: Server list is not empty
      ansible.builtin.assert:
        that:
          - backup_servers is iterable
          - backup_servers is not string
          - backup_servers | length > 0
        fail_msg: >
          backup_servers пуст. Задай список серверов в Extra Variables:
          {"backup_servers": ["ru-vps-main"]}
        success_msg: "Серверов в очереди: {{ backup_servers | length }}"

    - name: All backup_servers exist in inventory
      ansible.builtin.assert:
        that: backup_servers | difference(hostvars.keys() | list) | length == 0
        fail_msg: >
          Нет в inventory: {{ backup_servers | difference(hostvars.keys() | list) | join(', ') }}.
        success_msg: "Все серверы найдены в inventory"

    # При -O контроллер запускает на той стороне `scp -t`, поэтому бинарник
    # нужен и на телефоне тоже. RouterOS реализует протокол сам, ему нечего
    # проверять.
    - name: Check scp on the phone
      ansible.builtin.stat:
        path: "{{ termux_prefix }}/bin/scp"
      register: termux_scp

    - name: Host is Termux and has scp
      ansible.builtin.assert:
        that: termux_scp.stat.exists
        fail_msg: >
          Не найден {{ termux_prefix }}/bin/scp.
          Если это не Termux — проверь ansible_host/ansible_port в inventory.
          Если Termux — поставь пакет: pkg install openssh
        success_msg: "Termux найден: {{ termux_prefix }}"

    - name: Check scp on the Ansible host
      ansible.builtin.shell: "command -v scp"
      delegate_to: localhost
      register: ctrl_scp
      changed_when: false
      failed_when: ctrl_scp.rc != 0

    # delegate_to подменяет ansible_host/ansible_user/ansible_port
    - name: Remember phone connection details
      ansible.builtin.set_fact:
        phone_host: "{{ ansible_host | default(inventory_hostname) }}"
        phone_user: "{{ ansible_user }}"
        phone_port: "{{ ansible_port | default(22) }}"

    # Один штамп на весь запуск: все серверы получают поколение с одной датой
    - name: Take a single timestamp for the whole run
      ansible.builtin.command: date +%Y-%m-%d_%H-%M-%S
      delegate_to: localhost
      changed_when: false
      register: backup_stamp_cmd

    - name: Remember the timestamp
      ansible.builtin.set_fact:
        backup_stamp: "{{ backup_stamp_cmd.stdout }}"

    - name: Ensure destination directory exists on the phone
      ansible.builtin.file:
        path: "{{ backup_dest }}"
        state: directory

  tasks:
    - name: Acquire Termux wake lock
      ansible.builtin.command: "{{ termux_prefix }}/bin/termux-wake-lock"
      changed_when: false
      when: termux_wake_lock | bool

    - name: Sync servers
      block:
        - name: Start with an empty result list
          ansible.builtin.set_fact:
            backup_results: []

        - name: Sync each server
          ansible.builtin.include_tasks: tasks/backup_sync_server.yml
          loop: "{{ backup_servers }}"
          loop_control:
            loop_var: backup_server
            label: "{{ backup_server }}"

        # Сводка
        - name: Collect storage stats from the phone
          ansible.builtin.shell:
            executable: "{{ termux_prefix }}/bin/bash"
            cmd: |
              set -u
              dest='{{ backup_dest }}'
              gens() {
                find "$1" -maxdepth 1 -type d -name 'backup-*' ! -name '*.incomplete'
              }
              printf '{"free_kb":%s,"servers":{' "$(df -Pk "$dest" | awk 'NR==2 {print $4}')"
              first=1
              for d in "$dest"/*/; do
                [ -d "$d" ] || continue
                name=$(basename "$d")
                count=$(gens "$d" | wc -l | tr -d ' ')
                newest=$(gens "$d" | sed 's#.*/backup-##' | sort -r | head -n 1)
                bytes=$(find "$d" -type f -exec stat -c '%s' {} + 2>/dev/null | awk '{s+=$1} END {print s+0}')
                [ "$first" -eq 1 ] || printf ','
                first=0
                printf '"%s":{"gens":%s,"newest":"%s","bytes":%s}' \
                  "$name" "${count:-0}" "${newest:-never}" "${bytes:-0}"
              done
              printf '}}'
          changed_when: false
          register: phone_stats_raw

        - name: Backup storage summary
          ansible.builtin.debug:
            msg: "{{ report_text.split('\n') }}"
          vars:
            stats: "{{ phone_stats_raw.stdout | from_json }}"
            used_bytes: "{{ stats.servers.values() | map(attribute='bytes') | sum }}"
            report_text: |-
              Backup storage summary:
              {% for r in backup_results %}
              {% set s = stats.servers.get(r.server, {}) %}
              {{ '%-18s' | format(r.server) }} {{ '%10s' | format(s.get('bytes', 0) | human_readable) }}  {{ s.get('gens', 0) }} gens  newest {{ s.get('newest', 'never') }}  {{ r.status }}{{ ' — ' + r.msg if r.msg else '' }}
              {% endfor %}

              Phone free:            {{ (stats.free_kb | int * 1024) | human_readable }}
              Phone used by backups: {{ used_bytes | int | human_readable }}

        - name: Remember which servers did not sync
          ansible.builtin.set_fact:
            backup_failed: >-
              {{ backup_results | rejectattr('status', 'eq', 'OK')
                 | map(attribute='server') | list }}

        # Письмо уходит ДО assert: тот валит плей, и всё, что после него,
        # уже не выполнится.
        - name: Notify by email about servers that did not sync
          ansible.builtin.include_role:
            name: notify_email
          vars:
            notify_email_subject: >-
              [Ansible] backup_sync: {{ backup_failed | length }} из
              {{ backup_servers | length }} не синхронизированы
            notify_email_body: |
              Прогон: {{ backup_stamp }}

              {% for r in backup_results %}
              {{ '%-18s' | format(r.server) }} {{ r.status }}{{ ' — ' + r.msg if r.msg else '' }}
              {% endfor %}

              Прошлые поколения упавших серверов на телефоне не тронуты.
              Подробности — в логе задачи Semaphore.
          when: backup_failed | length > 0

        - name: All servers synced successfully
          ansible.builtin.assert:
            that: backup_failed | length == 0
            fail_msg: >
              Не синхронизированы: {{ backup_failed | join(', ') }}.
              Прошлые поколения этих серверов на телефоне не тронуты.
            success_msg: "Все серверы синхронизированы"

      always:
        - name: Release Termux wake lock
          ansible.builtin.command: "{{ termux_prefix }}/bin/termux-wake-unlock"
          changed_when: false
          when: termux_wake_lock | bool

